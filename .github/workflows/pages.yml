# Déploie SITE/ sur GitHub Pages.
# Nécessaire parce que Pages, en mode branche, ne sert que la racine ou /docs,
# alors que la convention SOL·IA veut un dossier SITE/ miroir exact de l'OVH.
#
# ⚠️ Les versions d'actions se périment : upload-pages-artifact@v3 s'appuyait sur
# upload-artifact@v3, désactivé par GitHub. L'étape réussissait sans rien déposer,
# et le déploiement échouait sur « 0 artifact ». Versions relevées le 23/11/2026.
name: Deploiement Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: SITE
      - id: deployment
        uses: actions/deploy-pages@v5
