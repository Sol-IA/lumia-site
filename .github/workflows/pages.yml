# Publie SITE/ à la racine de la branche gh-pages, que GitHub Pages sert en
# mode branche classique.
#
# Pourquoi ce détour : Pages en mode branche ne sert que la racine ou /docs,
# or la convention SOL·IA veut un dossier SITE/, miroir exact de l'OVH. La voie
# officielle par artefact (upload-pages-artifact + deploy-pages) déposait bien
# l'artefact mais deploy-pages ne le retrouvait pas, y compris avec les
# versions à jour et la permission actions: read. Cette méthode-ci n'utilise ni
# artefact ni API, seulement git, et aucune action tierce.
#
# À la bascule sur OVH, ce fichier et la branche gh-pages deviennent inutiles.
name: Deploiement Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Publier SITE/ sur gh-pages
        run: |
          set -e
          cd SITE
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication depuis ${GITHUB_SHA:0:8}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
